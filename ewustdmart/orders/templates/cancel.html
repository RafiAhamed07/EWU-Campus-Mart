{% extends "buyer_base.html" %}
{% block title %}Payment Cancelled - East West University Campus Mart{% endblock %}

{% block styles %}
<style>
    .status-shell {
        min-height: calc(100vh - 180px);
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 2rem 0;
    }

    .status-card {
        width: min(100%, 680px);
        margin: 0 1rem;
        padding: 1.25rem;
        text-align: center;
    }

    @media (min-width: 640px) {
        .status-card {
            margin: 0;
            padding: 2rem;
        }
    }

    .status-icon {
        width: 3.5rem;
        height: 3.5rem;
        border-radius: 999px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        margin-bottom: 1rem;
        font-size: 1.3rem;
        font-weight: 800;
        background: rgba(242, 178, 79, 0.2);
        color: #f2b24f;
        border: 1px solid rgba(242, 178, 79, 0.35);
    }
</style>
{% endblock %}

{% block content %}
<section class="status-shell page-shell">
    <div class="glass-card status-card">
        <span class="status-icon">CN</span>
        <h2 class="section-title mt-0">Payment Cancelled</h2>
        <p class="section-subtitle">You cancelled the payment. You can retry checkout from your cart anytime.</p>
        <a href="/cart" class="btn btn-outline-glow btn-aesthetic px-4 py-2 mt-3">Back to Cart</a>
    </div>
</section>
{% endblock %}
