{% extends 'buyer_base.html' %}
{% load static %}

{% block title %}Buyer - EWU Campus Mart{% endblock %}

{% block styles %}
<style>
  .hero {
    background: url('{% static "home/images/img1.jpg" %}') center/cover no-repeat;
    min-height: calc(100vh - 80px);
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    position: relative;
  }

  .hero::before {
    content: "";
    position: absolute;
    top: 0; left: 0; right: 0; bottom: 0;
    background: radial-gradient(circle, rgba(15,23,42,0.4) 0%, rgba(15,23,42,0.85) 100%);
  }

  .glass-box {
    position: relative;
    background: rgba(255, 255, 255, 0.05);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    border: 1px solid rgba(255, 255, 255, 0.1);
    border-radius: 1.5rem;
    padding: 2rem 1.5rem;
    max-width: 600px;
    box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
    animation: floatIn 1s ease-out forwards;
  }

  @media (min-width: 640px) {
    .glass-box {
      padding: 3rem 2.5rem;
    }
  }

  @media (min-width: 1024px) {
    .glass-box {
      padding: 3.2rem 2.5rem;
    }
  }

  @keyframes floatIn {
    from { opacity: 0; transform: translateY(30px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .hero h1 {
    font-weight: 800;
    font-size: 1.75rem;
    background: linear-gradient(135deg, #ffffff, #94a3b8);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    letter-spacing: -0.02em;
    margin-bottom: 1rem;
  }

  @media (min-width: 640px) {
    .hero h1 {
      font-size: 2.5rem;
      margin-bottom: 1.25rem;
    }
  }

  @media (min-width: 1024px) {
    .hero h1 {
      font-size: 3rem;
    }
  }

  .hero p {
    font-size: 1rem;
    color: #e2e8f0;
    margin-bottom: 1.5rem;
    line-height: 1.6;
  }

  @media (min-width: 640px) {
    .hero p {
      font-size: 1.15rem;
      margin-bottom: 2rem;
    }
  }
</style>
{% endblock %}

{% block content %}
<!-- Hero Section -->
<section class="hero">
  <div class="glass-box">
    <h1>Join as Buyer</h1>
    <p>Please select an option to continue.</p>
    <div class="d-flex justify-content-center gap-2 gap-sm-3 mt-3 mt-sm-4 flex-wrap">
      <a href="{% url 'buyer-login' %}" class="btn btn-primary-glow btn-aesthetic px-4 px-sm-5">Log In</a>
      <a href="{% url 'buyer-signup' %}" class="btn btn-outline-glow btn-aesthetic px-4 px-sm-5">Sign Up</a>
    </div>
  </div>
</section>
{% endblock %}
